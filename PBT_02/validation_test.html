<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }

        form {
            max-width: 700px;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 10px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            max-width: 400px;
            padding: 8px;
            margin-top: 4px;
        }

        button {
            margin-top: 15px;
            padding: 8px 14px;
        }
    </style>
</head>
<body>
    <h1>Kiểm tra validation HTML5</h1>

    <form action="#" method="post">
        <fieldset>
            <legend>5 trường hợp validation</legend>

            <label for="case1">Trường hợp 1 (Required):</label>
            <input type="text" id="case1" name="case1" required value="">

            <label for="case2">Trường hợp 2 (Email):</label>
            <input type="email" id="case2" name="case2" value="abc">

            <label for="case3">Trường hợp 3 (Number Range):</label>
            <input type="number" id="case3" name="case3" min="1" max="10" value="15">

            <label for="case4">Trường hợp 4 (Pattern 10 chữ số):</label>
            <input type="text" id="case4" name="case4" pattern="[0-9]{10}" value="abc123">

            <label for="case5">Trường hợp 5 (Minlength):</label>
            <input type="password" id="case5" name="case5" minlength="8" value="123">

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>`
        </fieldset>
    </form>
</body>
</html>
