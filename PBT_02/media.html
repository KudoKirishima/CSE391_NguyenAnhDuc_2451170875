<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Multimedia</title>
</head>
<body>
    <header>
        <h1>Giới thiệu sản phẩm bằng Multimedia</h1>

        <svg width="120" height="120" viewBox="0 0 120 120" aria-label="Logo shop" role="img">
            <circle cx="60" cy="60" r="50" fill="lightblue"></circle>
            <rect x="40" y="40" width="40" height="40" fill="blue"></rect>
        </svg>
    </header>

    <main>
        <section>
            <h2>Hình ảnh sản phẩm</h2>

            <figure>
                <img
                    src="https://placehold.co/400x250?text=San+pham+1"
                    alt="Ảnh minh họa sản phẩm số 1"
                    width="400"
                    height="250"
                    loading="lazy"
                    style="max-width: 100%; height: auto;"
                >
                <figcaption>Sản phẩm 1</figcaption>
            </figure>

            <figure>
                <img
                    src="https://placehold.co/400x250?text=San+pham+2"
                    alt="Ảnh minh họa sản phẩm số 2"
                    width="400"
                    height="250"
                    loading="lazy"
                    style="max-width: 100%; height: auto;"
                >
                <figcaption>Sản phẩm 2</figcaption>
            </figure>

            <figure>
                <img
                    src="https://placehold.co/400x250?text=San+pham+3"
                    alt="Ảnh minh họa sản phẩm số 3"
                    width="400"
                    height="250"
                    loading="lazy"
                    style="max-width: 100%; height: auto;"
                >
                <figcaption>Sản phẩm 3</figcaption>
            </figure>
        </section>

        <section>
            <h2>Video YouTube</h2>
            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="Video giới thiệu sản phẩm"
                loading="lazy"
                allowfullscreen
            ></iframe>
        </section>

        <section>
            <h2>Video HTML5</h2>
            <video
                controls
                width="560"
                poster="https://placehold.co/560x315?text=Video+Poster"
            >
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                Trình duyệt của bạn không hỗ trợ video.
            </video>
        </section>

        <section>
            <h2>Audio</h2>
            <audio controls>
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3" type="audio/mpeg">
                Trình duyệt của bạn không hỗ trợ audio.
            </audio>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Trang multimedia</p>
    </footer>
</body>
</html>
