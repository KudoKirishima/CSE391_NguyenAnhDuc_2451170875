<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }

        form {
            max-width: 700px;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 15px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select, textarea, button {
            width: 100%;
            max-width: 500px;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
        }

        .inline-option {
            display: block;
            margin-top: 8px;
        }

        button {
            width: auto;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h1>Form đăng ký tài khoản</h1>

    <form action="#" method="POST">
        <fieldset>
            <legend>Thông tin cá nhân</legend>

            <label for="fullname">Họ tên</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                required
                minlength="2"
                maxlength="50"
                placeholder="Nhập họ tên của bạn"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="example@email.com"
            >

            <label for="phone">Số điện thoại</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                pattern="[0-9]{10}"
                placeholder="Nhập 10 chữ số"
                title="Số điện thoại phải gồm đúng 10 chữ số"
            >

            <label for="birthday">Ngày sinh</label>
            <input
                type="date"
                id="birthday"
                name="birthday"
                max="2026-06-04"
            >
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                pattern="[A-Za-z0-9_]{3,20}"
                placeholder="Nhập username"
                title="Username chỉ gồm chữ cái, số và dấu gạch dưới, từ 3 đến 20 ký tự"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                placeholder="Nhập mật khẩu"
                title="Mật khẩu phải có ít nhất 8 ký tự, gồm ít nhất 1 chữ hoa và 1 số"
            >

            <label for="confirm-password">Xác nhận password</label>
            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                minlength="8"
                pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                placeholder="Nhập lại mật khẩu"
                title="Ô này có cùng rule như password, nhưng HTML không tự so sánh 2 ô giống nhau"
            >
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>

            <label for="city">Thành phố</label>
            <select id="city" name="city">
                <option value="">-- Chọn thành phố --</option>
                <option value="hanoi">Hà Nội</option>
                <option value="hcm">TP. Hồ Chí Minh</option>
                <option value="danang">Đà Nẵng</option>
                <option value="haiphong">Hải Phòng</option>
                <option value="cantho">Cần Thơ</option>
            </select>

            <label for="district">Quận / Huyện</label>
            <select id="district" name="district">
                <option value="">-- Chọn quận / huyện --</option>
                <option value="dongda">Đống Đa</option>
                <option value="caugiay">Cầu Giấy</option>
                <option value="thanhxuan">Thanh Xuân</option>
                <option value="hadong">Hà Đông</option>
                <option value="longbien">Long Biên</option>
            </select>

            <label for="address">Địa chỉ chi tiết</label>
            <textarea
                id="address"
                name="address"
                rows="3"
                placeholder="Nhập số nhà, đường, phường/xã..."
            ></textarea>

            <fieldset>
                <legend>Giới tính</legend>

                <label class="inline-option" for="male">
                    <input type="radio" id="male" name="gender" value="male">
                    Nam
                </label>

                <label class="inline-option" for="female">
                    <input type="radio" id="female" name="gender" value="female">
                    Nữ
                </label>

                <label class="inline-option" for="other">
                    <input type="radio" id="other" name="gender" value="other">
                    Khác
                </label>
            </fieldset>
        </fieldset>

        <label class="inline-option" for="agree">
            <input type="checkbox" id="agree" name="agree" required>
            Tôi đồng ý với điều khoản sử dụng
        </label>

        <button type="submit">Đăng ký</button>
        <button type="reset">Nhập lại</button>
    </form>
</body>
</html>
