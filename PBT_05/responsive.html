<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">ShopResponsive</div>

        <button class="hamburger" aria-label="Mở menu">☰</button>

        <nav class="nav-menu">
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Khuyến mãi</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <div class="page-layout">
        <aside class="sidebar">
            <h2>Bộ lọc</h2>
            <label><input type="checkbox"> Điện thoại</label>
            <label><input type="checkbox"> Laptop</label>
            <label><input type="checkbox"> Phụ kiện</label>
            <label><input type="checkbox"> Dưới 1 triệu</label>
        </aside>

        <main class="main-content">
            <h1>Danh sách sản phẩm</h1>

            <section class="product-grid">
                <article class="card">
                    <img src="https://placehold.co/300x200" alt="Sản phẩm 1">
                    <h2>Sản phẩm 1</h2>
                    <p>299.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/300x200" alt="Sản phẩm 2">
                    <h2>Sản phẩm 2</h2>
                    <p>499.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/300x200" alt="Sản phẩm 3">
                    <h2>Sản phẩm 3</h2>
                    <p>699.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/300x200" alt="Sản phẩm 4">
                    <h2>Sản phẩm 4</h2>
                    <p>899.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/300x200" alt="Sản phẩm 5">
                    <h2>Sản phẩm 5</h2>
                    <p>1.099.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/300x200" alt="Sản phẩm 6">
                    <h2>Sản phẩm 6</h2>
                    <p>1.299.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/300x200" alt="Sản phẩm 7">
                    <h2>Sản phẩm 7</h2>
                    <p>1.499.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/300x200" alt="Sản phẩm 8">
                    <h2>Sản phẩm 8</h2>
                    <p>1.699.000đ</p>
                </article>
            </section>
        </main>

        <aside class="ads-bar">
            <h2>Quảng cáo</h2>
            <img src="https://placehold.co/180x500?text=ADS" alt="Banner quảng cáo">
        </aside>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 ShopResponsive</p>
    </footer>
</body>
</html>
