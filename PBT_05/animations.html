<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations Demo</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <main class="page">
        <h1>CSS Transitions & Animations</h1>

        <section class="card-section">
            <article class="card fade-in">
                <div class="image-box">
                    <img src="https://placehold.co/300x200" alt="Sản phẩm">
                </div>
                <h2>Sản phẩm demo</h2>
                <p>Card hover effect với shadow và translateY</p>
                <a href="#" class="buy-btn">Mua ngay</a>
            </article>
        </section>

        <section class="spinner-section">
            <h2>Loading Spinner</h2>
            <div class="spinner"></div>
        </section>

        <section class="fade-section fade-in">
            <h2>Fade In Demo</h2>
            <p>Khối này dùng hiệu ứng fade-in từ dưới lên</p>
        </section>
    </main>
</body>
</html>
