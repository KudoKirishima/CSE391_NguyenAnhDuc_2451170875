<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="./css/grid.css">
</head>
<body>
    <div class="layout">
        <header>ShopGrid</header>

        <section class="hero">
            <h2>Banner khuyến mãi</h2>
            <p>Ưu đãi cho khách hàng trong tuần này</p>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <label><input type="checkbox"> Điện thoại</label>
            <label><input type="checkbox"> Laptop</label>
            <label><input type="checkbox"> Phụ kiện</label>
        </aside>

        <main class="main">
            <div class="products">
                <article class="card">
                    <img src="https://placehold.co/250x180" alt="Sản phẩm 1">
                    <h3>Sản phẩm 1</h3>
                    <p>299.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/250x180" alt="Sản phẩm 2">
                    <h3>Sản phẩm 2</h3>
                    <p>499.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/250x180" alt="Sản phẩm 3">
                    <h3>Sản phẩm 3</h3>
                    <p>699.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/250x180" alt="Sản phẩm 4">
                    <h3>Sản phẩm 4</h3>
                    <p>899.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/250x180" alt="Sản phẩm 5">
                    <h3>Sản phẩm 5</h3>
                    <p>1.099.000đ</p>
                </article>

                <article class="card">
                    <img src="https://placehold.co/250x180" alt="Sản phẩm 6">
                    <h3>Sản phẩm 6</h3>
                    <p>1.299.000đ</p>
                </article>
            </div>
        </main>

        <aside class="ads">
            <h3>Quảng cáo</h3>
            <img src="https://placehold.co/180x400?text=ADS" alt="Banner quảng cáo">
        </aside>

        <footer>© 2026 ShopGrid</footer>
    </div>
</body>
</html>
